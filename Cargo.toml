[package]
name = "tiny-tensor-engine"
version = "0.2.0"
edition = "2021"
authors = ["Yone Suárez <yonesuarezviera@gmail.com>"]
description = "High-performance, zero-dependency low-level tensor & quantized inference engine in pure Rust"
